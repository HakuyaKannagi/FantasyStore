<!doctype html>
<html lang="ja" data-store-manager="false">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' fantasy-image:; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'; connect-src 'none'">
  <title>FantasyStore — 架空ショッピング</title>
  <link rel="stylesheet" href="./css/app.css">
</head>
<body>
  <header class="app-header">
    <div class="header-main">
      <button type="button" class="brand-button" data-route="catalog" data-normal-control>
        <span class="brand-name">FantasyStore</span>
        <span class="brand-subtitle">架空ショッピング</span>
      </button>
      <form id="global-search-form" class="global-search" role="search">
        <label class="sr-only" for="global-search-input">商品を検索</label>
        <input id="global-search-input" type="search" maxlength="200" placeholder="商品を検索" data-normal-control>
        <button type="submit" class="btn btn-primary search-button" data-normal-control>検索</button>
      </form>
      <nav aria-label="メインナビゲーション">
        <button type="button" class="nav-button" data-route="catalog" data-normal-control>商品一覧</button>
        <button type="button" class="nav-button" data-route="cart" data-normal-control>カート</button>
        <button type="button" class="nav-button" data-route="history" data-normal-control>購入履歴</button>
      </nav>
    </div>
    <p class="simulation-strip">実際の購入・決済・請求・配送は発生しない架空ショッピングです。</p>
  </header>
  <main id="app-main" tabindex="-1" aria-live="polite"></main>

  <div id="notice-overlay" class="notice-overlay" role="dialog" aria-modal="true" aria-labelledby="notice-title">
    <section class="notice-card">
      <p class="eyebrow">FantasyStore</p>
      <h2 id="notice-title">このアプリについて</h2>
      <p>これは架空のショッピング体験を楽しむためのジョーク／デモ・シミュレーションアプリです。</p>
      <p>このアプリでは実際の購入、決済、請求、配送は行われません。</p>
      <p>制作者が公式に配布するサンプル商品コンテンツは、AIを利用して生成された架空の商品です。</p>
      <p>第三者が作成・配布した追加パックについては、その作成者が提供する内容をご確認ください。</p>
      <button id="notice-accept" class="btn btn-primary btn-large" type="button" autofocus>了解して始める</button>
    </section>
  </div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
